resource_types:
  - name: ansible-playbook
    url: https://github.com/troykinsella/concourse-ansible-playbook-resource
    description: "Execute ansible-playbook to provision remote systems."
    image: troykinsella/concourse-ansible-playbook-resource

  - name: apache-directory-index
    url: https://github.com/cloudlena/apache-directory-index-resource
    description: "Tracks changes to an Apache Directory Index (e.g. `http://mirror.easyname.ch/apache/tomcat/`)"
    image: mastertinner/apache-directory-index-resource

  - name: appcenter-resource
    url: https://github.com/tomoyukim/concourse-appcenter-resource
    description: "Concourse resource for distributing a build artifact to Microsoft App Center."
    image: tomoyukim/concourse-appcenter-resource

  - name: aptly-cli
    url: https://github.com/SHyx0rmZ/aptly-cli-resource
    description: "Enables you to transfer packages between your job and an aptly repository"
    image: shyxormz/aptly-cli-resource

  - name: artifacthub
    url: https://github.com/hdisysteme/artifacthub-resource
    description: "Tracks and gets new versions of Helm Charts which are registered at https://artifacthub.io/"
    image: ghcr.io/hdisysteme/artifacthub-resource:latest

  - name: artifactory
    url: https://github.com/spring-io/artifactory-resource
    description: 'Check, deploy and retrieve artifacts using the "builds" and "artifact properties" Artifactory features.'
    image: springio/artifactory-resource

  - name: artifactory
    url: https://github.com/troykinsella/concourse-artifactory-resource
    description: "Publish artifacts, such as tarballs, to Artifactory generic repositories."
    image: troykinsella/concourse-artifactory-resource

  - name: artifactory-deb
    url: https://github.com/troykinsella/concourse-artifactory-deb-resource
    description: "Fetch from, and publish to Debian/Ubuntu apt repositories in Artifactory."
    image: troykinsella/concourse-artifactory-deb-resource

  - name: artifactory-docker
    url: https://github.com/digitalocean/artifactory-docker-resource
    description: "Concourse resource for triggering, getting and putting new versions of docker / container image artifacts within Artifactory repositories."
    image: digitalocean/artifactory-docker-resource

  - name: awx
    url: https://github.com/mamercad/concourse-awx-resource
    description: "Launches AWX job templates and workflows"
    image: quay.io/mamercad/concourse-awx-resource

  - name: bitbucket-build-status
    url: https://github.com/SHyx0rmZ/bitbucket-build-status-resource
    description: "Lets you update the build status for commits in Bitbucket"
    image: shyxormz/bitbucket-build-status-resource

  - name: bitbucket-pr
    url: https://github.com/n7mobile/concourse-bitbucket-pr
    description: "Tracks pull requests on BitBucket and updates it's status"
    image: n7docker/concourse-bitbucket-pr

  - name: blackduck
    url: https://github.com/elgohr/concourse-blackduck
    description: "Use Blackduck from Concourse"
    image: lgohr/blackduck-resource

  - name: bosh-config
    url: https://github.com/cloudfoundry-community/bosh-config-resource
    description: "A resource for interacting with configs (Cloud, Runtime, CPI, etc…) living on a Bosh server"
    image: cfcommunity/bosh-config-resource

  - name: bosh-io-release
    url: https://github.com/concourse/bosh-io-release-resource
    description: "Tracks BOSH releases published on https://bosh.io"
    image: concourse/bosh-io-release-resource

  - name: bosh-io-stemcell
    url: https://github.com/concourse/bosh-io-stemcell-resource
    description: "Tracks BOSH stemcells published on https://bosh.io"
    image: concourse/bosh-io-stemcell-resource

  - name: bugsnag-build
    url: https://github.com/dcsg/bugsnag-build-resource
    description: "Notifies Bugsnag Build API of a new release"
    image: dcsg/bugsnag-build-resource

  - name: capistrano
    url: https://github.com/SHyx0rmZ/capistrano-resource
    description: "Enables you to run Capistrano deployments from your pipeline"
    image: shyxormz/capistrano-resource

  - name: cf
    url: https://github.com/cloudfoundry-community/cf-resource
    description: "Concourse resource for interacting with Cloud Foundry"
    image: concourse/cf-resource

  - name: cf-cli
    url: https://github.com/nulldriver/cf-cli-resource
    description: "The missing link between Concourse and Cloud Foundry. Push apps, create services, manage container networking and more!"
    image: nulldriver/cf-cli-resource

  - name: chartmuseum
    url: https://github.com/cathive/concourse-chartmuseum-resource
    description: "Fetches, verifies and publishes Helm Charts from a running ChartMuseum instance. Harbor works as well, since it uses ChartMuseum under the hood."
    image: cathive/concourse-chartmuseum-resource

  - name: cogito
    url: https://github.com/Pix4D/cogito
    description: "Cogito updates the GitHub status of a commit during a build. Simple configuration and lightweight image."
    image: pix4d/cogito

  - name: concourse-webhook-resource
    url: https://github.com/ardavanhashemzadeh/concourse-webhook-resource
    description: "Use files in git repo to track and throttle API calls as pipeline trigger."
    image: ardavanhashemzadeh/concourse-webhook-resource

  - name: consul-kv
    url: https://github.com/mdb/concourse-consul-kv-resource
    description: "Get or set a key/value pair in Consul's KV store."
    image: clapclapexcitement/concourse-consul-kv-resource

  - name: coralogix-event
    url: https://github.com/coralogix/eng-concourse-resource-coralogix-event
