    image: quay.io/coralogix/eng-coralogix-event-resource

  - name: cron
    url: https://github.com/vmware-archive/cron-resource
    description: "Implements a resource that reports new versions when the current time matches the crontab expression"
    image: cftoolsmiths/cron-resource

  - name: datadog-event
    url: https://github.com/concourse/datadog-event-resource
    description: "Fetch or emit events to Datadog."
    image: concourse/datadog-event-resource

  - name: datetime-version
    url: https://github.com/dcsg/datetime-version-resource
    description: "A resource to generate a date time version"
    image: dcsg/datetime-version-resource

  - name: dhall
    url: https://github.com/coralogix/eng-concourse-resource-dhall
    description: "Tracks the changes in a remote Dhall expression, and makes them available locally."
    image: quay.io/coralogix/eng-concourse-resource-dhall

  - name: digitalocean-kubernetes-resource
    url: https://git.sr.ht/~kdihalas/concourse-do-kubernetes-resource
    description: "Create, update and delete Digitalocean Kubernetes Clusters."
    image: kdihalas/digitalocean-kubernetes-resource

  - name: docker-compose
    url: https://github.com/troykinsella/concourse-docker-compose-resource
    description: "Use docker-compose to control Docker containers on remote hosts."
    image: troykinsella/concourse-docker-compose-resource

  - name: docker-image
    url: https://github.com/concourse/docker-image-resource
    description: "A resource for docker images"
    image: concourse/docker-image-resource

  - name: duct-tape
    url: https://github.com/homeport/duct-tape-resource
    description: "Generic custom Concourse resource with which one can define the check, in, and out as inline scripts right in the pipeline resource definition. It is for when you quickly need a Concourse resource for a specific task, but writing one from scratch would take too long. With this resource, one can glue things together."
    image: ghcr.io/homeport/duct-tape-resource

  - name: fly
    url: https://github.com/troykinsella/concourse-fly-resource
    description: "Manipulate the Concourse fly command-line client."
    image: troykinsella/concourse-fly-resource

  - name: forgejo
    url: https://codeberg.org/aniva/forgejo-concourse
