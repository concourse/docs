  - name: gate
    url: https://github.com/meshcloud/gate-resource
    description: "A generic gate resource for Concourse CI. Allows you to model quality gates and pipeline control flow."
    image: meshcloud/gate-resource

  - name: gcs
    url: https://github.com/frodenas/gcs-resource
    description: "Concourse resource for interacting with Google Cloud Storage"
    image: frodenas/gcs-resource

  - name: git
    url: https://github.com/concourse/git-resource
    description: "Tracks commits in a branch of a Git repository"
    image: concourse/git-resource

  - name: git-tags
    url: https://tangled.org/joshghiloni.me/git-tags-resource
    description: "Check generic git repositories for new tags, regardless of provider. Uses pure git operations instead of provider APIs"
