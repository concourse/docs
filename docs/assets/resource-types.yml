    tag: stable

  - name: Github
    resource_name: github
    url: https://github.com/PixelAirIO/github-resource
    description: "Resource that allows pipelines to interact with Github, like checking out and running status checks on Pull Requests."
    image: docker.io/pixelairio/github-resource

  - name: github-app-token
    url: https://github.com/tenjaa/concourse-github-app-token
