  - name: github-pr-comment
    url: https://github.com/nderjung/concourse-github-pr-comment-resource
    description: "Monitors incoming comments on a Github Pull Request and is able to monitor for comments matching regular expressions, match comment author's association with the project, the pull request's state and any labels it has been assigned."
    image: ndrjng/concourse-github-pr-comment-resource

  - name: github-release
    url: https://github.com/concourse/github-release-resource
    description: "A resource for github releases"
    image: concourse/github-release-resource

  - name: githubapps-content-resource
    url: https://github.com/totegamma/githubapps-content-resource
